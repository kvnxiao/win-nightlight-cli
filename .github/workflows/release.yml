# Publishes the workspace crates to crates.io through Trusted Publishing when a version tag is pushed

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: windows-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - name: Disable git core.autocrlf on Windows
        run: git config --global core.autocrlf false

      - name: Checkout repository code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches workspace version
        shell: bash
        run: |
          pkgid="$(cargo pkgid -p win-nightlight-cli)"
          version="${pkgid##*[#@]}"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
